# =============================================================================
# CM-MTD Configuration
# When Moving Target Defense Meets Attack Prediction in Digital Twins
# (Zhang et al., IEEE JSAC 2023)
#
# Every tunable in the pipeline lives here. Nothing in src/ hardcodes a
# dataset-specific dimension, path, or hyperparameter — input_dim/num_classes
# are inferred at load time (src/datasets/base.py::DatasetBundle), and
# experiment.dataset / experiment.predictor are the pipeline's two
# independent experimental variables: switch either one without touching
# any Python.
# =============================================================================

experiment:
  name: "cm_mtd"
  dataset: "cicids2017"    # "cicids2017" | "5g_nidd" — selects a datasets.<name> block below
  predictor: "transformer" # "transformer" | "lstm" — selects the transformer:/lstm: block below
  seed: 42
  device: "cpu"          # "cpu" or "gpu" — see README for the TF/GPU notes
  log_dir: "logs"
  # checkpoint_dir / results_dir below are BASE directories — actual runs
  # write to <dir>/<dataset>/<predictor>/ (see src/config_parser.py::get_run_paths).
  # This keeps checkpoints/results from different dataset/predictor
  # combinations from silently overwriting or shadowing each other, and
  # matches the layout scripts/generate_figures.py auto-discovers.
  checkpoint_dir: "checkpoints"
  results_dir: "results"

# -----------------------------------------------------------------------------
# Datasets — one block per dataset this project supports, each pointing at
# the SELF-CONTAINED directory its own preprocessing notebook writes
# (notebooks/cicids2017.ipynb / notebooks/5g-nidd.ipynb). Loading is
# delegated to src/datasets/ (one adapter per dataset, routed through a
# registry) — see that package's docstring for why: the two notebooks agree
# on the broad shape (X_*.npy/y_*.npy/class_names.npy/feature_names.npy/
# preprocessing_metadata.json, chronological 80/10/10 split, same 3-class
# taxonomy) but differ in real ways a single shared loader would get wrong
# (CICIDS-2017 alone emits per-sequence dones_*_seq.npy episode-boundary
# flags; preprocessing_metadata.json's own schema differs between the two).
#
# input_dim and num_classes are NEVER set here — always inferred from the
# .npy arrays themselves at load time.
# -----------------------------------------------------------------------------
datasets:
  cicids2017:
    # Notebook's own CONFIG["OUTPUT_DIR"]. Point this at wherever that
    # actually landed if you changed it in the notebook.
    data_dir: "dataset/cicids2017/drl_dataset"

    # Safety cap on how many rows the RL ENVIRONMENT cycles through for its
    # per-node row assignment (a prior run segfaulted loading the full
    # CICIDS-2017 label set directly into the env). This does NOT affect
    # Stage-2 sequence-model training -- that always uses the full,
    # genuinely-contiguous dataset, since sequence windows need real
    # row-to-row temporal adjacency that a truncated/reordered view would
    # fragment. Set to null to disable and let the environment cycle
    # through every row.
    max_samples: 200000

    # Row selection when max_samples < total rows (RL environment only --
    # see above). "head" is a plain contiguous prefix (preserves order,
    # but may under-represent rare classes in that prefix). "stratified_head"
    # takes the first N rows per class instead, which guarantees class
    # representation for the environment's HAM/RM logic but reorders rows
    # relative to the original file -- fine here since the environment
    # already assigns rows to nodes via an artificial round-robin, not
    # genuine per-node temporal meaning.
    truncation_strategy: "stratified_head"   # "head" | "stratified_head"

    # Fallback class names ONLY used if class_names.npy is missing from
    # data_dir (e.g. an older/partial preprocessing run) -- normally the
    # notebook's own class_names.npy is authoritative and this is ignored.
    # In notebook-CLASS_TO_ID order: 0=Benign, 1=Scan/Infiltration, 2=DDoS.
    class_names: ["Benign", "Scan/Infiltration", "DDoS"]

  5g_nidd:
    # Notebook's own OUTPUT_DIR.
    data_dir: "dataset/5g-nidd/drl_dataset"
    max_samples: 200000
    truncation_strategy: "stratified_head"
    # Same 3-class taxonomy as CICIDS-2017 today (see
    # src/datasets/nidd5g.py's docstring for why this is declared
    # explicitly per-dataset rather than assumed shared).
    class_names: ["Benign", "Scan/Infiltration", "DDoS"]

# -----------------------------------------------------------------------------
# Stage 1: Event Classifier (raw per-row features -> classified event label)
#
# scripts/diagnose_separability.py showed these features are highly
# separable via a plain classifier (Random Forest: ~100% Benign/DoS-DDoS
# recall on CICIDS-2017) but performed poorly when fed directly into an
# LSTM as a raw sliding window. This classifier does the part the data is
# good for; the sequence model below (Stage 2) does the genuinely
# sequential part -- see models.py's EventClassifier / LSTMAttackPredictor
# docstrings.
# -----------------------------------------------------------------------------
event_classifier:
  n_estimators: 200
  max_depth: 16

# -----------------------------------------------------------------------------
# Stage 2: LSTM Attack Predictor (Section VI-A, Eq. 11-12, Fig. 4)
# Architecture: Embedding(num_classes, embedding_dim) ("event embedding
# layer") -> LSTM -> Dense -> Softmax. Operates on the SEQUENCE OF LABELS
# Stage 1 assigns to recent rows, not raw features -- matching the paper's
# own description of the LSTM's input as classified "detection logs"
# (Section IV), and matching Eq. 12's literal formulation
# (X^t_k = past event labels). Shared across datasets — dataset choice
# only changes num_classes (inferred) and the data feeding Stage 1.
# -----------------------------------------------------------------------------
lstm:
  sequence_length: 10        # L in Eq. 12 — length of history window
  embedding_dim: 32          # width of the learned per-class embedding ("event embedding layer")
  lstm_units: [64]           # stacked LSTM layer sizes
  dense_units: [32]
  dropout: 0.2
  learning_rate: 0.001
  optimizer: "adam"          # paper specifies Adam (Section VI-A)
  # Section VI-A literally specifies mean-squared-error loss for a softmax
  # classification head, which is unusual and empirically less stable here
  # than categorical crossentropy. Neither, however, is confirmed to fix
  # the deeper problem observed on real CICIDS-2017 data: with a STATIC
  # per-class weight multiplier, training either collapsed to
  # always-predict-Benign (weight too mild) or overcorrected to
  # mostly-predict-DDoS (weight too strong). Focal loss (Lin et al.
  # 2017, models.py::categorical_focal_loss) is offered as an alternative
  # that in principle should be less sensitive to the exact class_weight
  # ratio -- BUT testing against a synthetic reproduction of this exact
  # failure pattern did NOT reliably escape the collapse either. Treat
  # this as an available option worth trying, not a proven fix; run
  # scripts/diagnose_separability.py against your real data first to
  # determine whether the problem is even in this sequence-model/windowing
  # pipeline, versus upstream in feature preprocessing.
  loss_function: "focal"   # "focal" | "categorical_crossentropy" | "mse"
  focal_gamma: 2.0          # only used when loss_function="focal"; higher = more focus on hard examples
  batch_size: 256
  epochs: 15
  validation_split: 0.1

  # CICIDS-2017's Scan/Infiltration class is a small minority (it absorbs
  # the tiny original "Infiltration" label, so it inherits some of that
  # rarity even collapsed together with PortScan/Web-Attack/Patator/Bot).
  # A naive `class_weight="balanced"` produces weights large enough that
  # training can collapse (loss -> NaN, predictions collapse to one class).
  # We use balanced weights but clip the max/min ratio.
  # balanced_capped (inverse-frequency, then ratio-clipped) was the
  # original default but was observed to overcorrect on real CICIDS-2017
  # data: DDoS (~13% of rows -- not actually rare) got boosted enough to
  # flip the model from "always predict Benign" to "mostly predict DDoS",
  # making net accuracy WORSE than the trivial majority-class baseline.
  # balanced_sqrt dampens the same inverse-frequency weights via sqrt --
  # gentler, and now paired with focal loss above so getting this exact
  # ratio right matters less than it did with crossentropy alone.
  class_weight_strategy: "balanced_sqrt"   # "none" | "balanced" | "balanced_capped" | "balanced_sqrt"
  max_class_weight_ratio: 20.0                # cap: max_weight <= ratio * min_weight

# -----------------------------------------------------------------------------
# Stage 2: Transformer Attack Predictor (see models.py::TransformerAttackPredictor)
# Same shared hyperparameters as lstm: above (sequence_length, loss,
# class weighting, training schedule) plus attention-specific sizing.
# d_model defaults to matching lstm.embedding_dim so LSTM vs Transformer
# comparisons in scripts/compare_architectures.py aren't confounded by a
# trivial "one model just has a wider embedding" difference.
# -----------------------------------------------------------------------------
transformer:
  sequence_length: 10
  d_model: 32                     # embedding / attention width
  num_heads: 4                    # must evenly divide d_model
  num_transformer_blocks: 2       # stacked self-attention + FFN blocks
  d_ff: 128                       # position-wise feed-forward hidden width (4x d_model)
  dense_units: [32]
  dropout: 0.2
  learning_rate: 0.001
  loss_function: "focal"          # "focal" | "categorical_crossentropy" | "mse"
  focal_gamma: 2.0
  batch_size: 256
  epochs: 15
  validation_split: 0.1
  class_weight_strategy: "balanced_sqrt"
  max_class_weight_ratio: 20.0

# -----------------------------------------------------------------------------
# Fairness / Trust / Energy evaluation (see src/metrics.py). Computed
# during --mode train_lstm / --mode all and saved to results/<dataset>/<predictor>/.
# -----------------------------------------------------------------------------
evaluation:
  compute_fairness: true
  compute_trust: true
  compute_energy: true
  calibration_bins: 10            # bins for Expected Calibration Error
  stability_perturbation_samples: 500   # windows tested for prediction_stability
  stability_benign_class: 0             # class id treated as "non-informative" for the swap test

# -----------------------------------------------------------------------------
# Network / Digital Twin topology (Section III-A, Table I)
# Generated with a Waxman random graph via NetworkX, consistent with the
# paper's simulation setup. Dataset-independent.
# -----------------------------------------------------------------------------
network:
  topology: "waxman"
  num_nodes: 12               # |V ∪ M| — IoT/cloud nodes + OpenFlow switches
  num_openflow_switches: 12
  waxman_alpha: 0.2
  waxman_beta: 0.15
  num_ip_pools: 16            # w — candidate IP address spaces (paper range [30,150]; reduced for tractable action space)
  num_flows: 8                # k — number of active flows needing routes
  flow_table_capacity: 64     # C_cap_j in Eq. 9
  link_delay_ms: 2.0          # T_l in Eq. 10
  qos_delay_threshold_ms: 50.0  # C_del_y in Eq. 10

# -----------------------------------------------------------------------------
# Reward function (Section III-C-5, Eq. 1-3)
#
#   TODO(paper-clarify): α1, α2 (Eq. 1), C (positive constant, Eq. 1),
#   γ1, γ2 (Eq. 2) are never given numeric values in the paper or its
#   appendix. The values below are engineering placeholders chosen so that
#   defense reward dominates resource-consumption penalty by roughly an
#   order of magnitude (a common choice in MTD-RL literature), NOT values
#   taken from the paper. Revisit if the authors' code/values surface.
# -----------------------------------------------------------------------------
reward:
  alpha1: 1.0        # TODO(paper-clarify): weight on scan count Θ_t,i
  alpha2: 2.0        # TODO(paper-clarify): weight on compromised-switch count Υ_t
  positive_constant_C: 10.0   # TODO(paper-clarify): reward when no successful attack
  gamma1: 0.05       # TODO(paper-clarify): HAM resource-consumption weight
  gamma2: 0.05       # TODO(paper-clarify): RM resource-consumption weight

  # TODO(paper-clarify): resource consumption model. Eq. 2 defines W_t via
  # e^a_i (HAM cost per node) and e^r_y (RM cost per flow) but never states
  # their units or how they scale with pool size / route length. Placeholder
  # model: cost scales linearly with the number of nodes re-addressed /
  # flows rerouted this step, normalized by network size.
  resource_model: "linear_per_mutation"   # "linear_per_mutation" | "constant"
  ham_unit_cost: 1.0
  rm_unit_cost: 1.0

# -----------------------------------------------------------------------------
# Fidelity metric (Eq. 18) — categorical prediction accuracy across nodes.
#   TODO(paper-clarify): Eq. 18 itself (Y(p_i,y_i) match indicator, averaged
#   over |N|) is unambiguous as a formula, but the paper does not say
#   whether N is "per time-slot across all nodes" or "cumulative over an
#   evaluation window". We compute it per-batch during evaluation
#   (matches Fig. 7's per-episode curves) — flagged here since it affects
#   how directly figures are reproducible.
# -----------------------------------------------------------------------------
fidelity:
  aggregation: "per_episode_batch"   # TODO(paper-clarify)

# -----------------------------------------------------------------------------
# Upper layer — DQN over macro-actions (Section VI-B, Eq. 13-14, Table I)
# Macro-actions O = {o_c, o_a, o_r, o_s} = {HAM+RM, HAM-only, RM-only, STATIC}
# -----------------------------------------------------------------------------
dqn:
  hidden_layers: [256]        # Table I
  activation: "relu"          # Table I
  learning_rate: 0.001        # Table I
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 3000
  replay_buffer_size: 50000
  batch_size: 64
  target_update_every: 200    # steps, theta^u_{t-n} <- theta^u_t (line 42)
  min_replay_before_train: 500

# -----------------------------------------------------------------------------
# Lower layer — PPO over micro-actions (Section VI-B, Eq. 15-17, Table I)
# Actor outputs a Gaussian policy (paper's complexity analysis notes the
# actor head has "2 neurons" = mean & log-std); the continuous sample is
# mapped deterministically to an IP-pool index and a route index per flow.
# -----------------------------------------------------------------------------
ppo:
  hidden_layers: [256, 256]   # Table I
  activation: "tanh"          # Table I
  learning_rate: 0.0001       # Table I
  gamma: 0.99                 # Table I (GAE)
  gae_lambda: 0.95            # Table I (GAE)
  clip_epsilon: 0.2           # Table I
  steps_per_macro_action: 25  # K, "number of steps on each episode" (Table I)
  update_epochs: 10           # U in Algorithm 1
  minibatch_size: 5           # Table I "mini-batch size"
  entropy_coef: 0.01
  value_coef: 0.5

# -----------------------------------------------------------------------------
# Training loop (Algorithm 1)
# -----------------------------------------------------------------------------
training:
  num_episodes: 10000          # M in Algorithm 1 / Table I
  steps_per_episode: 25        # T in Algorithm 1 / Table I ("steps on each episode")
  eval_every_episodes: 100
  save_every_episodes: 500
