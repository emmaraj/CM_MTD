# ============================================================
# CM-MTD Configuration File
# Paper: "When Moving Target Defense Meets Attack Prediction
#          in Digital Twins" (IEEE JSAC 2023)
# ============================================================

# ─── Experiment Meta ───────────────────────────────────────
experiment:
  name: "CM-MTD-CICIDS2017"
  version: "1.0.0"
  description: "Collaborative Mutation-based MTD in DTMN"
  seeds: [42, 123, 456, 789, 1024]   # 5 independent seeds
  device: "cuda"                        # "cuda" or "cpu"
  log_level: "INFO"

# ─── Data Configuration ────────────────────────────────────
data:
  cicids2017_path: "data/cicids2017"     # Place CSV files here
  processed_path: "data/processed"
  synthetic_path: "data/synthetic"
  use_synthetic: true                   # Set false when real data available

  # Dataset splits
  train_split: 0.70
  val_split: 0.10
  test_split: 0.20
  stratify: true
  random_seed: 42

  # Sequence construction
  sequence_length: 10       # L in paper: look-back window
  step_size: 1              # Sliding window step
  min_sequence_events: 5    # Minimum events per sequence

  # Class balancing
  balance_strategy: "smote"  # "smote", "undersample", "none"
  max_samples_per_class: 50000

# ─── Attack Label Mapping ──────────────────────────────────
attack_labels:
  BENIGN: 0
  DoS: 1           # DoS Hulk, DoS GoldenEye, DoS Slowhttptest, DoS slowloris
  DDoS: 2          # DDoS
  PortScan: 3      # PortScan
  Infiltration: 4  # Infiltration
  Bot: 5           # Bot
  BruteForce: 6   # FTP-Patator, SSH-Patator
  WebAttack: 7     # Web Attack - Brute Force, XSS, SQL Injection

# Mapping raw CICIDS2017 labels to unified attack classes
label_mapping:
  "BENIGN": "BENIGN"
  "DoS Hulk": "DoS"
  "DoS GoldenEye": "DoS"
  "DoS Slowhttptest": "DoS"
  "DoS slowloris": "DoS"
  "Heartbleed": "DoS"
  "DDoS": "DDoS"
  "PortScan": "PortScan"
  "Infiltration": "Infiltration"
  "Bot": "Bot"
  "FTP-Patator": "BruteForce"
  "SSH-Patator": "BruteForce"
  "Web Attack – Brute Force": "WebAttack"
  "Web Attack – XSS": "WebAttack"
  "Web Attack – Sql Injection": "WebAttack"
  "Web Attack Brute Force": "WebAttack"
  "Web Attack XSS": "WebAttack"
  "Web Attack Sql Injection": "WebAttack"

# ─── LSTM Attack Prediction ────────────────────────────────
lstm:
  # Architecture
  embedding_dim: 32          # smaller → forces generalisation, not memorisation
  lstm_units: [128, 64]
  dense_units: [64]          # simpler head → less overfitting on majority class
  dropout_rate: 0.2          # was 0.3 — high dropout blocks minority class learning
  recurrent_dropout: 0.1     # was 0.2
  n_classes: 8               # matches attack_labels count

  # Training
  learning_rate: 0.001
  batch_size: 128            # smaller batches → more diverse class exposure per step
  epochs: 100
  early_stopping_patience: 15  # give model more time to recover from LR drops
  lr_reduce_patience: 8        # was 5 — stop cutting LR too aggressively
  lr_reduce_factor: 0.5
  min_lr: 1.0e-5             # was 1e-6 — stop reducing into useless territory

  # Regularization
  l2_regularization: 1.0e-5  # was 1e-4 — less penalisation on minority classes
  gradient_clip_norm: 1.0

  # Class imbalance fix (applied automatically in train_lstm.py)
  use_class_weights: true     # sklearn balanced weights — critical for CICIDS-2017

  # Evaluation
  metrics: ["accuracy", "precision", "recall", "f1", "confusion_matrix"]

# ─── Network (DTMN) Model ──────────────────────────────────
network:
  n_nodes: 12           # |V| = n IoT + cloud nodes (paper: 12/100)
  n_switches: 12        # |M| = m OpenFlow switches
  n_flows: 10           # |F| = k flows
  n_ip_spaces: 30       # w IP address spaces
  n_ip_per_node: 3      # number of IP spaces per node
  topology: "waxman"    # Waxman random topology
  waxman_alpha: 0.2     # α parameter (paper Table I)
  waxman_beta: 0.15     # β parameter (paper Table I)
  link_bandwidth: 5.0   # Mbps (paper Table I)
  flow_table_capacity: 100  # C^cap_j per switch
  max_delay_ms: 50.0    # C^del_y maximum delay threshold

# ─── SMDP Model ────────────────────────────────────────────
smdp:
  # Macro-action space: {o_c, o_a, o_r, o_s}
  macro_actions:
    - "STATIC"          # o_s: static IP + routes
    - "HAM_ONLY"        # o_a: host address mutation only
    - "RM_ONLY"         # o_r: route mutation only
    - "HAM_RM"          # o_c: both HAM and RM
  n_macro_actions: 4
  macro_action_duration: 5  # K: constant time slots per macro-action

# ─── Reward Function (Eq. 1, 2, 3 from paper) ─────────────
reward:
  alpha1: 1.0     # coefficient for scan success penalty
  alpha2: 1.0     # coefficient for DDoS switch penalty
  C_defense: 10.0 # positive constant when attacks fail
  gamma1: 0.5     # coefficient for HAM resource cost
  gamma2: 0.5     # coefficient for RM resource cost

# ─── DQN (Upper Layer) ─────────────────────────────────────
dqn:
  # Architecture
  hidden_layers: [256]          # paper: [256]
  activation: "relu"
  dueling: true                  # Dueling DQN variant

  # Training
  learning_rate: 1.0e-3
  gamma: 0.99                   # discount factor γ
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  
  # Replay buffer
  buffer_size: 100000
  batch_size: 64
  min_buffer_size: 1000         # warm-up episodes

  # Target network
  target_update_freq: 10        # update every N episodes

# ─── PPO (Lower Layer) ─────────────────────────────────────
ppo:
  # Architecture
  hidden_layers: [256, 256]     # paper: [256, 256]
  activation: "tanh"

  # Training
  learning_rate: 1.0e-4
  gamma: 0.99                   # discount factor γ
  gae_lambda: 0.95              # λ for GAE (paper: λ=0.95)
  clip_range: 0.2               # ε clip (paper: 0.2)
  value_coef: 0.5               # value function coefficient
  entropy_coef: 0.01            # entropy bonus coefficient
  max_grad_norm: 0.5

  # Mini-batch
  n_steps: 256                  # steps before PPO update
  mini_batch_size: 5            # paper: K=5 mini-batch
  n_epochs: 10                  # PPO update epochs

# ─── Training Protocol ─────────────────────────────────────
training:
  # Episodes
  n_episodes: 10000             # M in paper
  n_steps_per_episode: 25       # T in paper
  K_steps: 5                    # K inner steps per macro-action

  # Checkpointing
  checkpoint_freq: 500          # save every N episodes
  checkpoint_dir: "checkpoints"
  
  # Evaluation during training
  eval_freq: 100
  n_eval_episodes: 50
  
  # Logging
  log_dir: "logs"
  tensorboard: true

# ─── Evaluation ────────────────────────────────────────────
evaluation:
  n_eval_episodes: 1000         # episodes for evaluation
  confidence_level: 0.95        # for confidence intervals
  results_dir: "results"
  
  # Statistical tests
  statistical_tests:
    - "paired_ttest"
    - "wilcoxon"
    - "effect_size_cohen_d"
  
  # Baselines to compare
  baselines:
    - "STATIC"
    - "HAM_ONLY"
    - "RM_ONLY"
    - "RRT_FRVM"
    - "DQN_RM_FRVM"
    - "CM_MTD"               # proposed

# ─── Simulation Parameters (Table I) ──────────────────────
simulation:
  # Network topology
  n_switches_small: 12
  n_switches_large: 100
  n_nodes_small: 12
  n_nodes_large: 100
  
  # Communication
  comm_range_switches: 250    # meters
  link_bandwidth: 5           # Mbps
  
  # IP address spaces
  n_ip_spaces: 128            # size of IP address space
  
  # Training hyperparameters (Table I)
  n_episodes: 10000
  n_steps: 25
  mini_batch: 5
  gae_gamma: 0.99
  gae_lambda: 0.95
  clip_coeff_ppo: 0.2
  dqn_hidden: [256]
  dqn_activation: "ReLU"
  dqn_lr: 1.0e-3
  ppo_hidden: [256, 256]
  ppo_activation: "tanh"
  ppo_lr: 1.0e-4
  optimizer: "Adam"

# ─── Visualization ─────────────────────────────────────────
visualization:
  style: "seaborn-v0_8-paper"
  dpi: 300
  figure_size: [8, 6]
  font_size: 12
  line_width: 2.0
  export_formats: ["png", "pdf", "svg"]
  results_dir: "results/figures"
  
  # Color palette for methods
  colors:
    CM_MTD: "#d62728"       # red (proposed)
    RRT_FRVM: "#1f77b4"     # blue
    DQN_RM_FRVM: "#2ca02c"  # green
    STATIC: "#7f7f7f"       # gray
    HAM_ONLY: "#ff7f0e"     # orange
    RM_ONLY: "#9467bd"      # purple
